name: Sonance
options:
  bundleIdPrefix: com.sonance
  deploymentTarget:
    iOS: "16.1"

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.1"
  TARGETED_DEVICE_FAMILY: "1"
  ENABLE_BITCODE: "NO"

targets:
  Sonance:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - Sonance
    info:
      path: Sonance/Info.plist
    entitlements:
      path: Sonance/Sonance.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sonance.player
      PRODUCT_NAME: Sonance
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"

  SonanceWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - SonanceWidgetExtension
    info:
      path: SonanceWidgetExtension/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sonance.player.widget
      PRODUCT_NAME: SonanceWidgetExtension
      PRODUCT_BUNDLE_PACKAGE_TYPE: "XPC!"
      GENERATE_INFOPLIST_KEY_CFBundlePackageType: "XPC!"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
