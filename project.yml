name: Sonance
options:
  bundleIdPrefix: com.sonance
  deploymentTarget:
    iOS: "16.1"
  xcodeVersion: "15.0"

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.1"
  TARGETED_DEVICE_FAMILY: "1" # iPhone
  ENABLE_BITCODE: "NO"

targets:
  Sonance:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: Sonance
    info:
      path: Sonance/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
    entitlements:
      path: Sonance/Sonance.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sonance.player
      PRODUCT_NAME: Sonance
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"

  SonanceWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: SonanceWidgetExtension
      - path: Sonance/Services/LiveActivity/SonanceActivityAttributes.swift
    info:
      properties:
        CFBundleDisplayName: SonanceWidgetExtension
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sonance.player.widget
      PRODUCT_NAME: SonanceWidgetExtension
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
